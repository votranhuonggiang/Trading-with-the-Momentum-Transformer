data:
  raw_path: "data/raw/vn30f1m.csv"
  processed_path: "data/processed/vn30f1m_5min.csv"
  features_path: "data/features/features_5min.parquet"
  timestamp_col: "timestamp"
  timeframe: "5min"

trading:
  intraday_only: true
  close_before_end_of_day: true
  no_overnight: true
  long_entry_threshold: 0.20
  short_entry_threshold: 0.25
  long_exit_threshold: 0.04
  short_exit_threshold: 0.06
  long_to_short_reverse_threshold: 0.45
  short_to_long_reverse_threshold: 0.35
  contract_multiplier: 100000
  margin_rate: 0.1848
  transfer_tax_rate: 0.001
  fee_vsdc_vnd_per_contract_per_side: 5000
  fee_hnx_vnd_per_contract_per_side: 2700
  fee_ctck_vnd_per_contract_per_side: 2700
  base_round_trip_cost_points: 0.20
  cost_scenarios_points: [0.20]

features:
  return_horizons: [1, 2, 3, 6, 12, 24, 48, 78]
  volatility_windows: [12, 24, 48, 78, 390]
  macd_pairs:
    - [8, 24]
    - [16, 48]
    - [32, 96]

models:
  sequence_lengths: [78, 156, 390]
  main_models:
    - "lstm_dmn"
    - "decoder_transformer"
    - "decoder_tft"

walk_forward:
  method: "expanding"
  validation_months: 6
  test_months: 6
  step_months: 6
  max_windows: 0

training:
  objective: "net_sharpe"
  max_epochs: 100
  max_epochs_per_window: 1
  max_train_rows_per_window: 5000
  max_valid_rows_per_window: 2000
  early_stopping_patience: 10
  device: "auto"
